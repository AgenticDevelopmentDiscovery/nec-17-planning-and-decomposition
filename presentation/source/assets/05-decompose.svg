<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F2EBDD"/><rect x="96" y="96" width="470" height="132" rx="18" fill="#1D1A17"/><text x="134" y="158" fill="#F2EBDD" font-family="Consolas,monospace" font-size="30">&quot;Add authentication.&quot;</text><text x="134" y="200" fill="#D7B56D" font-family="Arial" font-size="25">one goal</text><g fill="none" stroke="#500000" stroke-width="6" stroke-linecap="round"><path d="M230 228v404"/><path d="M230 384h70"/><path d="M230 508h70"/><path d="M230 632h70"/></g><g fill="#500000"><circle cx="230" cy="384" r="11"/><circle cx="230" cy="508" r="11"/><circle cx="230" cy="632" r="11"/></g><g font-family="Arial"><rect x="300" y="332" width="1030" height="104" rx="14" fill="#500000"/><text x="336" y="378" fill="#F2EBDD" font-size="31" font-weight="700">1. Sessions are issued and stored</text><text x="336" y="416" fill="#D7B56D" font-size="25">Log in, reload the page, stay signed in</text><rect x="300" y="456" width="1030" height="104" rx="14" fill="#500000"/><text x="336" y="502" fill="#F2EBDD" font-size="31" font-weight="700">2. Protected routes reject anonymous requests</text><text x="336" y="540" fill="#D7B56D" font-size="25">Call one without a session; it returns 401</text><rect x="300" y="580" width="1030" height="104" rx="14" fill="#500000"/><text x="336" y="626" fill="#F2EBDD" font-size="31" font-weight="700">3. Reset mail reaches a real inbox</text><text x="336" y="664" fill="#D7B56D" font-size="25">Request a reset; the message arrives</text></g><g fill="#167A55"><rect x="1346" y="352" width="154" height="64" rx="32"/><rect x="1346" y="476" width="154" height="64" rx="32"/><rect x="1346" y="600" width="154" height="64" rx="32"/></g><g fill="none" stroke="#F2EBDD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M1382 386l18 18 30-34"/><path d="M1382 510l18 18 30-34"/><path d="M1382 634l18 18 30-34"/></g><text x="800" y="772" text-anchor="middle" fill="#1D1A17" font-family="Bahnschrift,Arial" font-size="40" font-weight="700">EACH UNIT CARRIES ITS OWN PROOF</text><text x="800" y="826" text-anchor="middle" fill="#6A1111" font-family="Arial" font-size="27">Worked one at a time. Finished when the check passes, not when the agent says so.</text></svg>
