<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F2EBDD"/><g><rect x="88" y="120" width="440" height="700" rx="22" fill="#500000"/><text x="128" y="206" fill="#F2EBDD" font-family="Bahnschrift,Arial" font-size="46" font-weight="700">BOUNDARY</text><text x="128" y="266" fill="#D7B56D" font-family="Arial" font-size="30">What is in or out?</text><g fill="#F2EBDD" opacity="0.92"><rect x="128" y="332" width="200" height="54" rx="8"/><rect x="152" y="404" width="200" height="54" rx="8" opacity="0.6"/><rect x="214" y="476" width="200" height="54" rx="8" opacity="0.42"/><rect x="276" y="548" width="200" height="54" rx="8" opacity="0.26"/></g><text x="128" y="690" fill="#F2EBDD" font-family="Arial" font-size="27">Files we never</text><text x="128" y="726" fill="#F2EBDD" font-family="Arial" font-size="27">asked it to touch.</text></g><g><rect x="580" y="120" width="440" height="700" rx="22" fill="#D7B56D"/><text x="620" y="206" fill="#1D1A17" font-family="Bahnschrift,Arial" font-size="46" font-weight="700">COMPLETION</text><text x="620" y="266" fill="#5E4714" font-family="Arial" font-size="30">What proves done?</text><g stroke="#1D1A17" stroke-width="5" fill="none"><rect x="620" y="330" width="40" height="40" rx="6"/><rect x="620" y="402" width="40" height="40" rx="6"/><rect x="620" y="474" width="40" height="40" rx="6"/></g><g fill="#1D1A17" font-family="Arial" font-size="28"><text x="684" y="360">code written</text><text x="684" y="432">tests run</text><text x="684" y="504">behavior checked</text></g><g transform="rotate(-9 820 596)"><rect x="652" y="556" width="336" height="80" rx="10" fill="#500000"/><text x="700" y="610" fill="#F2EBDD" font-family="Bahnschrift,Arial" font-size="40" font-weight="700">ALL DONE!</text></g><text x="620" y="726" fill="#1D1A17" font-family="Arial" font-size="27">Nothing was run.</text></g><g><rect x="1072" y="120" width="440" height="700" rx="22" fill="#1D1A17"/><text x="1112" y="206" fill="#F2EBDD" font-family="Bahnschrift,Arial" font-size="46" font-weight="700">CONTINUITY</text><text x="1112" y="266" fill="#D7B56D" font-family="Arial" font-size="30">What survives?</text><rect x="1112" y="330" width="160" height="112" rx="12" fill="#F2EBDD"/><text x="1140" y="396" fill="#1D1A17" font-family="Arial" font-size="27">session 1</text><rect x="1332" y="330" width="160" height="112" rx="12" fill="#F2EBDD" opacity="0.35"/><text x="1360" y="396" fill="#F2EBDD" font-family="Arial" font-size="27">session 2</text><path d="M1278 386h22m22 0h22" stroke="#167A55" stroke-width="7" stroke-linecap="round"/><path d="M1296 350l20 72" stroke="#A33A2A" stroke-width="7" stroke-linecap="round"/><text x="1112" y="548" fill="#F2EBDD" font-family="Arial" font-size="27">The decisions were</text><text x="1112" y="584" fill="#F2EBDD" font-family="Arial" font-size="27">never written down,</text><text x="1112" y="620" fill="#F2EBDD" font-family="Arial" font-size="27">so they are gone.</text><text x="1112" y="726" fill="#D7B56D" font-family="Arial" font-size="27">Work gets redone.</text></g></svg>
