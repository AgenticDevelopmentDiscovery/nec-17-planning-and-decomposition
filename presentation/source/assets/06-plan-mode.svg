<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#500000"/><text x="96" y="130" fill="#F2EBDD" font-family="Bahnschrift,Arial" font-size="52" font-weight="700">Plan mode moves the work</text><g><rect x="96" y="196" width="420" height="300" rx="18" fill="#F2EBDD"/><text x="132" y="262" fill="#1D1A17" font-family="Bahnschrift,Arial" font-size="32" font-weight="700">A VAGUE GOAL</text><g fill="#C9BA9B"><rect x="132" y="300" width="340" height="20" rx="10"/><rect x="132" y="340" width="286" height="20" rx="10"/><rect x="132" y="380" width="318" height="20" rx="10"/></g><text x="132" y="448" fill="#6A1111" font-family="Arial" font-size="26">goes in</text></g><g fill="none" stroke="#D7B56D" stroke-width="7" stroke-linecap="round"><path d="M516 346h86"/><path d="M602 346l-26-20m26 20-26 20"/></g><g><rect x="620" y="196" width="420" height="300" rx="18" fill="#1D1A17"/><text x="656" y="262" fill="#F2EBDD" font-family="Bahnschrift,Arial" font-size="32" font-weight="700">A TIDY PLAN</text><g fill="#D7B56D"><rect x="656" y="300" width="28" height="20" rx="6"/><rect x="656" y="340" width="28" height="20" rx="6"/><rect x="656" y="380" width="28" height="20" rx="6"/></g><g fill="#8C8276"><rect x="700" y="300" width="300" height="20" rx="10"/><rect x="700" y="340" width="268" height="20" rx="10"/><rect x="700" y="380" width="288" height="20" rx="10"/></g><text x="656" y="448" fill="#D7B56D" font-family="Arial" font-size="26">comes out</text></g><g fill="none" stroke="#D7B56D" stroke-width="7" stroke-linecap="round"><path d="M1040 346h86"/><path d="M1126 346l-26-20m26 20-26 20"/></g><g><rect x="1144" y="196" width="356" height="300" rx="18" fill="#D7B56D"/><text x="1180" y="262" fill="#1D1A17" font-family="Bahnschrift,Arial" font-size="32" font-weight="700">READS AS</text><text x="1180" y="306" fill="#1D1A17" font-family="Bahnschrift,Arial" font-size="32" font-weight="700">RIGOROUS</text><text x="1180" y="372" fill="#5E4714" font-family="Arial" font-size="27">and can be</text><text x="1180" y="412" fill="#5E4714" font-family="Arial" font-size="27">confidently wrong</text><text x="1180" y="462" fill="#6A1111" font-family="Arial" font-size="25">about what you meant</text></g><rect x="96" y="566" width="1404" height="112" rx="16" fill="#F2EBDD"/><text x="140" y="614" fill="#1D1A17" font-family="Arial" font-size="29">Good at: surfacing files, steps and consequences you had not considered.</text><text x="140" y="654" fill="#6A1111" font-family="Arial" font-size="29">Cannot do: supply a vision you never gave it.</text><text x="96" y="762" fill="#D7B56D" font-family="Bahnschrift,Arial" font-size="40" font-weight="700">A GENERATED PLAN IS A PROPOSAL TO REVIEW</text><text x="96" y="818" fill="#E7DCC6" font-family="Arial" font-size="27">Reviewing one well means knowing what a good unit looks like. The skill relocates; it does not disappear.</text></svg>
