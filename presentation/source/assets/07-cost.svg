<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F2EBDD"/><text x="96" y="128" fill="#1D1A17" font-family="Bahnschrift,Arial" font-size="50" font-weight="700">Front-loaded work, so it is not always worth it</text><g><rect x="96" y="196" width="664" height="470" rx="20" fill="#1D1A17"/><text x="140" y="268" fill="#D7B56D" font-family="Bahnschrift,Arial" font-size="38" font-weight="700">SKIP IT</text><g fill="#F2EBDD" font-family="Arial" font-size="29"><text x="140" y="342">Throwaway scripts</text><text x="140" y="398">Exploration</text><text x="140" y="454">Anything you would rather</text><text x="140" y="492">restart than resume</text><text x="140" y="548">One-shot tasks that finish</text><text x="140" y="586">faster than the planning</text></g><g fill="none" stroke="#8C8276" stroke-width="4" stroke-linecap="round"><path d="M140 362h576"/><path d="M140 418h576"/><path d="M140 512h576"/></g></g><g><rect x="840" y="196" width="664" height="470" rx="20" fill="#167A55"/><text x="884" y="268" fill="#F2EBDD" font-family="Bahnschrift,Arial" font-size="38" font-weight="700">PAY IT</text><g fill="#F2EBDD" font-family="Arial" font-size="29"><text x="884" y="342">The work outlives one session</text><text x="884" y="398">Somebody other than you</text><text x="884" y="436">has to believe it works</text><text x="884" y="492">Being wrong is expensive</text><text x="884" y="530">to discover late</text></g><g fill="none" stroke="#5FA98B" stroke-width="4" stroke-linecap="round"><path d="M884 362h576"/><path d="M884 456h576"/></g></g><rect x="96" y="716" width="1408" height="120" rx="16" fill="#500000"/><text x="800" y="770" text-anchor="middle" fill="#F2EBDD" font-family="Bahnschrift,Arial" font-size="38" font-weight="700">YOU PAY BEFORE ANYTHING VISIBLY HAPPENS</text><text x="800" y="812" text-anchor="middle" fill="#D7B56D" font-family="Arial" font-size="27">which is exactly when it feels least worth paying</text></svg>
