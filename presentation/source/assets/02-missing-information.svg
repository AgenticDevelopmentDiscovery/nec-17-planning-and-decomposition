<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#500000"/><rect x="150" y="96" width="1300" height="208" rx="20" fill="#F2EBDD"/><text x="200" y="196" fill="#1D1A17" font-family="Consolas,monospace" font-size="62">Clean up the data pipeline.</text><text x="200" y="258" fill="#6A1111" font-family="Arial" font-size="30">One sentence. Three decisions never made.</text><g font-family="Bahnschrift,Arial" font-size="33" font-weight="700" fill="#F2EBDD"><rect x="150" y="386" width="392" height="372" rx="20" fill="none" stroke="#F2EBDD" stroke-width="6" stroke-dasharray="18 14"/><text x="196" y="462">WHAT BELONGS?</text><rect x="604" y="386" width="392" height="372" rx="20" fill="none" stroke="#D7B56D" stroke-width="6" stroke-dasharray="18 14"/><text x="650" y="462" fill="#D7B56D">WHAT IS ENOUGH?</text><rect x="1058" y="386" width="392" height="372" rx="20" fill="none" stroke="#F2EBDD" stroke-width="6" stroke-dasharray="18 14"/><text x="1104" y="462">HOW DO WE CHECK?</text></g><g font-family="Arial" font-size="27" fill="#E7DCC6"><text x="196" y="520">Which stages, which</text><text x="196" y="556">files, whose schema?</text><text x="650" y="520">What makes it done</text><text x="650" y="556">rather than started?</text><text x="1104" y="520">What would we open,</text><text x="1104" y="556">run, or read?</text></g><text x="800" y="836" text-anchor="middle" fill="#D7B56D" font-family="Bahnschrift,Arial" font-size="40" font-weight="700">THE AGENT ANSWERS THEM FOR US</text></svg>
